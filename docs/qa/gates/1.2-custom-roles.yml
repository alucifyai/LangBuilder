top_issues:
  - severity: low
    category: robustness
    description: 'Audit log immutability is documented but not enforced in code - CRUD service lacks explicit prevention of update/delete operations'
    refs:
      - 'src/backend/base/langflow/services/database/models/audit/model.py:29'
      - 'src/backend/base/langflow/services/database/models/audit/crud.py'
    suggested_owner: dev
    notes: 'AuditLog model documents "append-only" behavior in docstring, but CRUD service only implements create/read operations. No update/delete functions exist, which is correct, but adding explicit enforcement (e.g., custom __setattr__ to prevent field updates after creation) would strengthen guarantee. Current implementation is acceptable but could be more robust.'

  - severity: low
    category: api_design
    description: 'RoleResponse schema defines permissions as nullable (list[str] | None) but implementation always returns empty list for None values'
    refs:
      - 'src/backend/base/langflow/api/v1/roles.py:42'
      - 'src/backend/base/langflow/api/v1/roles.py:89'
    suggested_owner: dev
    notes: 'Minor API contract inconsistency. Code always coalesces None to [] when building responses. Either remove nullable type (list[str]) or document why None is possible. Current behavior is safe but schema could be clearer.'

