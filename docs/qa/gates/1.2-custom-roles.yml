ac_to_test_mapping:
  AC1:
    description: 'Successful creation of custom role "Deployer" with specific permissions'
    tests:
      - 'test_create_role_success (unit)'
      - 'test_complete_role_creation_workflow_with_audit (integration)'
    validation: |
      Given: I am logged in as an Admin
      And: I provide role name "Deployer" and permissions ["deploy_environment", "read"]
      When: I save the role via POST /api/v1/roles/
      Then: Role is created with name "Deployer"
      And: Role has version=1
      And: Role contains specified permissions
      And: Audit log entry created with action=role_created
      And: Role is available via GET /api/v1/roles/{role_id}

  AC2:
    description: 'Prevent duplicate role names with unique constraint and error message'
    tests:
      - 'test_duplicate_role_name_rejection (unit)'
      - 'test_role_update_with_duplicate_name (unit)'
    validation: |
      Given: I am logged in as an Admin
      And: A role "Editor" already exists
      When: I try to create another role named "Editor"
      Then: I receive HTTP 409 Conflict
      And: Error message is "Role name must be unique"
      And: No new role is created
      And: No audit log entry is created

      Also validates update scenario:
      When: I try to rename a different role to "Editor"
      Then: Same error and behavior

  AC3:
    description: 'Edit role and track version with audit log showing before/after states'
    tests:
      - 'test_role_update_increments_version (unit)'
      - 'test_audit_log_on_role_update (unit)'
      - 'test_complete_role_update_workflow_with_versioning (integration)'
      - 'test_concurrent_role_updates_version_handling (integration)'
    validation: |
      Given: I am logged in as an Admin
      And: Role "Deployer" exists with permissions ["deploy_environment"] and version=1
      When: I add "read" permission via PATCH /api/v1/roles/{role_id}
      Then: Role is updated with permissions ["deploy_environment", "read"]
      And: Version is incremented to 2
      And: Updated_at timestamp is refreshed
      And: Audit log entry created with action=role_updated
      And: Audit log before_state shows version=1 and old permissions
      And: Audit log after_state shows version=2 and new permissions

additional_validations:
  dependency_checking:
    tests:
      - 'test_role_deletion_with_active_grants (unit)'
      - 'test_role_deletion_without_active_grants (unit)'
      - 'test_role_deletion_with_dependency_checking (integration)'
    validation: |
      Given: Role "Deployer" has 3 active grants to users
      When: Admin attempts to delete the role
      Then: HTTP 409 Conflict returned
      And: Error message states "Cannot delete role: 3 active grants exist"
      And: Role is not deleted

      When: All grants are revoked
      And: Admin attempts to delete the role again
      Then: Role is successfully deleted
      And: Audit log entry created with action=role_deleted

  permission_validation:
    tests:
      - 'test_create_role_with_invalid_permissions (unit)'
      - 'test_permission_validation_during_role_operations (integration)'
    validation: |
      Given: Admin attempts to create role with permission "unknown:permission"
      When: POST /api/v1/roles/ is called
      Then: HTTP 400 Bad Request returned
      And: Error message states "Unknown permission id: unknown:permission"
      And: Role is not created

  audit_logging:
    tests:
      - 'test_audit_log_on_role_creation (unit)'
      - 'test_audit_log_on_role_update (unit)'
      - 'test_audit_log_on_role_deletion (unit)'
      - 'test_audit_log_actor_tracking (integration)'
    validation: |
      All role operations (create, update, delete) generate audit log entries with:
      - Unique ID
      - Timestamp (timezone-aware)
      - Actor ID (user who performed action)
      - Action type (role_created, role_updated, role_deleted)
      - Resource type ("role")
      - Resource ID (role UUID)
      - Before state (for updates and deletes)
      - After state (for creates and updates)
      - Optional metadata

