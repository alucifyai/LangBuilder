nfr_validation:
  security:
    status: CONCERNS
    notes: |
      - PASS: All CRUD operations use parameterized queries (no SQL injection risk)
      - PASS: Permission validation enforced before role creation
      - PASS: Invite email verification case-insensitive
      - PASS: Deny-by-default security model implemented
      - CONCERNS: Scope inheritance allows overly broad access without parent-child verification
      - PASS: RBAC enforcement integrated at critical endpoints (flow export, token management, invites)
      - CRITICAL BUG FIXED: Timezone-naive datetime.now() in grant expiration checks (fixed to datetime.now(timezone.utc))

  performance:
    status: PASS
    notes: |
      - PASS: Appropriate database indexes on Permission (resource_type, action)
      - PASS: Appropriate indexes on Grant (principal_id, role_id, scope_type, scope_id)
      - PASS: Appropriate index on Role (name)
      - PASS: Grant queries filter expired grants at database level
      - PASS: No N+1 query patterns detected
      - MINOR: Closest-scope-wins sorting happens in memory (acceptable for MVP, optimize later if needed)

  reliability:
    status: PASS
    notes: |
      - PASS: Comprehensive error handling with specific error messages
      - PASS: Role validation prevents creation with unknown permissions
      - PASS: Invite acceptance validates email, expiration, and status
      - PASS: Grant expiration handled automatically in queries
      - PASS: Proper use of timezone-aware datetimes throughout (after fix)
      - PASS: Graceful handling of missing grants (deny-by-default)

  maintainability:
    status: PASS
    notes: |
      - PASS: Clean separation of concerns (models, CRUD, service, API)
      - PASS: Well-documented code with clear docstrings
      - PASS: Consistent naming conventions
      - PASS: Type hints throughout (Python 3.10+ union syntax)
      - PASS: Enums used for principal_type and scope_type (data integrity)
      - PASS: Migration scripts with proper up/down functions
      - PASS: Architectural limitations clearly documented in code comments

recommendations:
  immediate:
    - action: 'Implement scope parent-child relationship validation in Story 2.1'
      refs: ['src/backend/base/langflow/services/auth/rbac.py:115-119']
      rationale: 'Current implementation allows workspace-level grants to cascade to ANY lower-scope resource, not just resources under that workspace. Security risk.'

    - action: 'Add workspace context to API token management'
      refs: ['src/backend/base/langflow/api/v1/api_key.py']
      rationale: 'Using hardcoded "default" workspace defeats purpose of workspace-scoped permissions.'

  future:
    - action: 'Refactor component endpoints to include component IDs in routes'
      refs: ['src/backend/base/langflow/api/v1/endpoints.py:678']
      rationale: 'Current endpoint structure (/custom_component/update) cannot support per-component RBAC.'

    - action: 'Add caching layer for frequently-checked permissions'
      refs: ['src/backend/base/langflow/services/auth/rbac.py']
      rationale: 'check_permission queries database on every call. Consider Redis cache for performance at scale.'

    - action: 'Add audit logging for permission checks'
      refs: ['src/backend/base/langflow/services/auth/rbac.py']
      rationale: 'Security best practice for compliance and debugging. Story 5.1 requirement.'

    - action: 'Implement rate limiting on invite endpoints'
      refs: ['src/backend/base/langflow/api/v1/invites.py']
      rationale: 'Prevent invite spam attacks.'

