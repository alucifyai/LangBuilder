    - 'Comprehensive assertions with specific error messages'

code_quality_findings:
  strengths:
    - 'SQLModel properly used with type hints'
    - 'Enums for type safety (PrincipalType, ScopeType, InviteStatus)'
    - 'Consistent error handling with HTTPException'
    - 'Clean separation: models → CRUD → service → API'
    - 'Proper async/await throughout'
    - 'Migration scripts follow Alembic best practices'
    - 'Seed script designed for idempotency (checks existing before insert)'

  issues_fixed:
    - file: 'src/backend/base/langflow/services/database/models/grant/crud.py'
      issue: 'Timezone-naive datetime.now() in grant expiration checks'
      fix: 'Changed to datetime.now(timezone.utc) for consistency with model defaults'
      severity: CRITICAL
      impact: 'Prevents timezone comparison errors between UTC model timestamps and naive query timestamps'

ac_to_test_mapping:
  AC1:
    description: 'Catalog includes CRUD and extended permissions'
    tests:
      - 'test_ac1_permission_catalog_completeness'
    validation: |
      Given: Permission catalog seeded with permissions
      When: Query all permissions
      Then: Verify CRUD permissions exist (flows:create, flows:read, etc.)
      And: Verify extended permissions exist (export_flow, deploy_environment, invite_users, modify_component_settings, manage_tokens)

  AC2:
    description: 'Role builder only accepts known permission IDs'
    tests:
      - 'test_ac2_role_validation_rejects_unknown_permissions'
      - 'test_role_validate_permissions_success (unit)'
      - 'test_role_validate_permissions_failure (unit)'
    validation: |
      Given: Attempt to create role with unknown permission
      When: Save the role
      Then: Error raised with message "Unknown permission id: <unknown>"
      And: Role is not created

  AC3:
    description: 'Export flow requires export_flow permission'
    tests:
      - 'test_ac3_export_flow_permission_enforcement'
    validation: |
      Given: User has export_flow on Flow=F123
      When: User exports Flow=F123
      Then: Export succeeds (permission check returns True)
      When: User exports Flow=F124
      Then: Access denied (permission check returns False)

  AC4:
    description: 'Deploy requires deploy_environment permission'
    tests:
      - 'test_ac4_deploy_environment_permission_enforcement'
    validation: |
      Given: User has deploy_environment on Environment=Staging
      When: User deploys to Staging
      Then: Deployment allowed (permission check returns True)
      When: User deploys to Production
      Then: Access denied (permission check returns False)

  AC5:
    description: 'Inviting users requires invite_users permission'
    tests:
      - 'test_ac5_invite_users_workspace_scoped'
    validation: |
      Given: User has invite_users at Workspace=WB1
      When: User invites to WB1
      Then: Invite created (permission check returns True)
      When: User invites to WB2
      Then: Access denied (permission check returns False)

  AC6:
    description: 'Only invited user can accept invite'
    tests:
      - 'test_invite_can_accept_success (unit)'
      - 'test_invite_can_accept_wrong_email (unit)'
      - 'test_invite_can_accept_email_case_insensitive (unit)'
      - 'test_invite_can_accept_expired (unit)'
      - 'test_invite_can_accept_already_accepted (unit)'
    validation: |
      Given: Invite INV1 for "new@acme.com" with status "pending" and not expired
      When: User "new@acme.com" accepts INV1
      Then: Grant created, invite status becomes "accepted"
      When: User "eve@acme.com" attempts to accept INV1
      Then: Error "invite_not_for_user", status remains "pending"

  AC7:
    description: 'Modifying component requires modify_component permission'
    tests: []
    validation: |
      DEFERRED: Current API endpoints lack component IDs in routes
      Pattern documented at: api/v1/endpoints.py:678
      Future implementation will use:
        check_permission(user_id, "modify_component_settings", "components", component_id, ScopeType.COMPONENT, component_id)

  AC8:
    description: 'Managing tokens requires manage_tokens permission'
    tests:
      - 'API protection implemented in api/v1/api_key.py'
    validation: |
      Given: User has manage_tokens at Project=PRJ1
      When: User creates API token
      Then: Token created (permission check required)
      When: User revokes token without permission
      Then: Error "permission_required: manage_tokens"

      NOTE: Current implementation uses workspace-level check with "default" scope due to architecture limitations.

