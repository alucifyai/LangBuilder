schema: 1
story: '1.1'
story_title: 'Permission Catalog and Basic Enforcement'
gate: CONCERNS
status_reason: 'Implementation is solid with comprehensive test coverage, but has documented architectural limitations that require attention in future stories. One critical bug fixed (timezone handling).'
reviewer: 'Quinn (Test Architect)'
updated: '2025-10-05T22:30:00Z'

top_issues:
  - severity: medium
    category: architecture
    description: 'Scope inheritance does not verify parent-child relationships between scopes (e.g., workspace WB1 grant cascades to ALL projects, not just projects under WB1)'
    refs:
      - 'src/backend/base/langflow/services/auth/rbac.py:115-119'
    suggested_owner: dev
    notes: 'Documented limitation for this story, but security risk for production. Must be addressed in Story 2.1 with scope hierarchy validation.'

  - severity: medium
    category: architecture
    description: 'API token management uses hardcoded "default" workspace scope instead of actual workspace IDs'
    refs:
      - 'src/backend/base/langflow/api/v1/api_key.py:52'
      - 'src/backend/base/langflow/api/v1/api_key.py:83'
    suggested_owner: dev
    notes: 'Documented limitation. Current architecture lacks workspace context. Requires refactoring in future story.'

  - severity: low
    category: coverage
    description: 'Component modification protection (AC7) deferred due to API architecture lacking component IDs in routes'
    refs:
      - 'src/backend/base/langflow/api/v1/endpoints.py:678'
    suggested_owner: dev
    notes: 'Pattern documented for future implementation. Requires API refactoring before RBAC can be applied.'

  - severity: low
    category: coverage
    description: 'Deployment environment protection (AC8) deferred as deployment functionality not yet implemented'
    refs: []
    suggested_owner: sm
    notes: 'No implementation exists yet. Pattern documented for when deployment feature is added.'

