# RBAC-specific nginx configuration

# Enable gzip for better performance
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

# RBAC Admin Interface routing
location /admin/rbac {
    try_files $uri $uri/ /index.html;
    
    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# RBAC API endpoints
location /api/v1/rbac/ {
    proxy_pass http://backend:7860;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    
    # Enable CORS for RBAC APIs
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
    
    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        add_header 'Content-Length' 0;
        return 204;
    }
    
    # Timeout settings
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Buffer settings
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
}

# Permission checking endpoint with caching
location /api/v1/rbac/check-permission {
    proxy_pass http://backend:7860;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Cache configuration for permission checks
    proxy_cache_path /var/cache/nginx/rbac levels=1:2 keys_zone=rbac_cache:10m max_size=100m inactive=5m;
    proxy_cache rbac_cache;
    proxy_cache_key "$scheme$proxy_host$request_uri$http_authorization";
    proxy_cache_valid 200 5m;    # Cache successful permission checks for 5 minutes
    proxy_cache_valid 403 1m;    # Cache denials for 1 minute
    proxy_cache_valid 401 30s;   # Cache auth failures for 30 seconds
    
    # Add cache status to response headers
    add_header X-Cache-Status $upstream_cache_status;
    
    # Don't cache if no authorization header
    proxy_no_cache $http_authorization = "";
}

# Batch permission checking (no caching due to dynamic nature)
location /api/v1/rbac/batch-check-permission {
    proxy_pass http://backend:7860;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # No caching for batch operations
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}

# WebSocket support for real-time RBAC updates
location /api/v1/rbac/ws {
    proxy_pass http://backend:7860;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Security headers for RBAC pages
location ~ ^/(admin|api/v1/rbac) {
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;
}

# Rate limiting for RBAC APIs
limit_req_zone $binary_remote_addr zone=rbac_api:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=rbac_auth:10m rate=10r/m;

location /api/v1/rbac/check-permission {
    limit_req zone=rbac_api burst=20 nodelay;
}

location ~ /api/v1/rbac/(login|register|reset-password) {
    limit_req zone=rbac_auth burst=5 nodelay;
}